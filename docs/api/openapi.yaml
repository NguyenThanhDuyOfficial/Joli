openapi: 3.2.0

info:
  title: Joli
  version: 1.0.0

servers:
  - url: http://localhost:3000/api/v1

tags:
  - name: Users
  - name: Products
  - name: Orders

paths:
  /products:
    get:
      tags: [Products]
      summary: get Products
      operationId: getProductList
      security: []
      parameters:
        - $ref: '#/components/parameters/Category'
        - $ref: '#/components/parameters/Tag'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200': { $ref: '#/components/responses/ProductListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '500': { $ref: '#/components/responses/InternalError' }

  /products/{slug}:
    get:
      tags: [Products]
      summary: get Product by slug
      operationId: getProductBySlug
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/ProductDetailResponse' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  /orders:
    get:
      tags: [Orders]
      summary: get Orders
      operationId: getOrderList
      security:
        - bearerAuth: []
      responses:
        '200': { $ref: '#/components/responses/OrderListResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

    post:
      tags: [Orders]
      summary: create Order
      operationId: createOrder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderSchema' }
      responses:
        '201': { $ref: '#/components/responses/OrderResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/InternalError' }

  /orders/{id}:
    get:
      tags: [Orders]
      summary: get Order by id
      operationId: getOrderById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { $ref: '#/components/responses/OrderResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

components:
  parameters:
    Category:
      name: category
      in: query
      required: false
      schema:
        type: string
      style: form
      explode: false
    Tag:
      name: tag
      in: query
      required: false
      schema:
        type: string
      style: form
      explode: false
    Search:
      name: search
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 100
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        enum:
          - newest
          - bestsellers
          - price_asc
          - price_desc
        default: newest
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  schemas:
    UserSchema:
      type: object
      properties:
        id: { type:string }
        email: { type:string, format: email }
        name: { type:string }
        emailVerified: { type: boolean }
        role:
          { type: string, default: user, enum: ['admin', 'user', 'manager'] }

    CategorySchema:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }

    ProductImageSchema:
      type: object
      required: [id, url]
      properties:
        id: { type: string }
        url: { type: string, format: uri }
        alt: { type: string }
        isPrimary: { type: boolean }

    ProductVariantSchema:
      type: object
      required: [id, stock]
      properties:
        id: { type: string }
        sku: { type: string, nullable: true }
        size: { type: string, nullable: true }
        color: { type: string, nullable: true }
        price: { type: number, nullable: true }
        stock: { type: integer, minimum: 0 }
        images:
          type: array
          items: { $ref: '#/components/schemas/ProductImageSchema' }
        isActive: { type: boolean }

    ProductSchema:
      type: object
      required: [id, name, slug, price]
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        price: { type: number }
        description: { type: string }
        isLoved: { type: boolean }
        starRating: { type: number, format: float }
        variants:
          type: array
          items: { $ref: '#/components/schemas/ProductVariantSchema' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/CategorySchema' }

        tags:
          type: array
          items: { type: string }

    ProductListSchema:
      type: object
      properties:
        data:
          type: array
          items:
            type: object
            required: [id, name, slug, variants]
            properties:
              id: { type: string }
              name: { type: string }
              slug: { type: string }
              variants:
                type: array
                items: { $ref: '#/components/schemas/ProductVariantSchema' }
              tags:
                type: array
                items: { type: string }
        pagination:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            totalPages: { type: integer }

    CreateOrderSchema:
      type: object
      required: [items, shippingAddress, paymentMethod]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [productId, quantity]
            properties:
              productId: { type: string }
              variantId: { type: string, nullable: true }
              quantity: { type: integer, minimum: 1 }
        shippingAddress:
          type: object
          required: [name, phone, address]
          properties:
            name: { type: string }
            phone: { type: string }
            address: { type: string }
            note: { type: string, nullable: true }
        paymentMethod:
          type: string
          enum: [cod, vnpay, momo, bank_transfer]

    OrderSchema:
      type: object
      required: [id, code, status, items, total, createdAt]
      properties:
        id: { type: string }
        code: { type: string }
        status:
          type: string
          enum: [pending, paid, shipping, delivered, cancelled]
        items:
          type: array
          items:
            type: object
            properties:
              productId: { type: string }
              variantId: { type: string, nullable: true }
              name: { type: string }
              image: { type: string, format: uri }
              price: { type: number }
              quantity: { type: integer }
              subtotal: { type: number }
        subtotal: { type: number }
        shippingFee: { type: number }
        total: { type: number }
        shippingAddress:
          type: object
          properties:
            name: { type: string }
            phone: { type: string }
            address: { type: string }
        paymentMethod: { type: string }
        paymentStatus:
          type: string
          enum: [unpaid, paid, refunded, pending, failed]
        createdAt: { type: string, format: date-time }

    OrderListSchema:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/OrderSchema' }

    Error:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        details: { type: object, nullable: true }

  responses:
    ProductListResponse:
      description: Product List Response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProductListSchema' }
    ProductDetailResponse:
      description: Product Detail Response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ProductSchema' }
    OrderResponse:
      description: Order Response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrderSchema' }
    OrderListResponse:
      description: Order List Response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OrderListSchema' }
    BadRequest:
      description: Bad Request Response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Unauthorized Response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not Found Response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InternalError:
      description: Internal Error Response
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
