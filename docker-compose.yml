services:
  db:
    image: postgres
    environment:
      POSTGRES_USER: nguyenthanhduyofficial
      POSTGRES_PASSWORD: nguyenthanhduyofficial
      POSTGRES_DB: postgres_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - nguyenthanhduyofficial_network

volumes:
  postgres_data:

networks:
  nguyenthanhduyofficial_network:
